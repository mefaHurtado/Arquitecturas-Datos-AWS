ecommerce_dw:
  target: aws
  outputs:
    aws:
      type: redshift
      host: "{{ env_var('DW_REDSHIFT_HOST') }}"
      port: 5439
      user: "{{ env_var('DW_REDSHIFT_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_REDSHIFT_PASSWORD') }}"
      dbname: "{{ env_var('DW_REDSHIFT_DATABASE', 'ecommerce') }}"
      schema: dbt_dev
      threads: 2
      sslmode: require
